<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2f2942">
    <meta name="description" content="Random Dice 2 骰子樹互動攻略圖。">
    <title>Random Dice 2｜骰子樹</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell" aria-labelledby="page-title">
      <header class="topbar">
        <div class="brand-block">
          <p class="eyebrow">RANDOM DICE 2</p>
          <h1 id="page-title">骰子樹</h1>
          <p class="subtitle">拖曳瀏覽・滾輪縮放・滑過節點查看完整資料</p>
        </div>

        <div class="search-block" role="search">
          <label class="sr-only" for="search-input">搜尋骰子樹節點</label>
          <div class="search-field">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input id="search-input" type="search" autocomplete="off" spellcheck="false" placeholder="搜尋骰子、符文、效果…">
            <button id="search-clear" class="icon-button search-clear" type="button" aria-label="清除搜尋" hidden>×</button>
            <kbd>/</kbd>
          </div>
          <div id="search-results" class="search-results" role="listbox" aria-label="搜尋結果" hidden></div>
          <p id="search-status" class="search-status" aria-live="polite">239 個節點</p>
        </div>
      </header>

      <aside class="minimap-panel" aria-label="骰子樹小地圖">
        <div class="panel-heading">
          <span>小地圖</span>
          <span id="zoom-readout">100%</span>
        </div>
        <button id="minimap" class="minimap" type="button" aria-label="點擊小地圖移動視野">
          <img src="data/dice_tree.svg" alt="骰子樹全圖縮圖">
          <span id="minimap-window" class="minimap-window" aria-hidden="true"></span>
        </button>
      </aside>

      <section id="viewport" class="map-viewport" aria-label="可互動骰子樹" tabindex="0">
        <div id="loading" class="loading-card">
          <span class="loading-mark" aria-hidden="true"></span>
          <span>載入骰子樹…</span>
        </div>
        <div id="scene" class="map-scene" aria-hidden="true"></div>
        <div id="empty-state" class="empty-state" hidden>找不到符合的節點</div>
      </section>

      <div class="map-toolbar" aria-label="地圖控制">
        <button id="zoom-out" class="toolbar-button" type="button" aria-label="縮小">−</button>
        <button id="zoom-reset" class="toolbar-button toolbar-button-wide" type="button">重設</button>
        <button id="zoom-in" class="toolbar-button" type="button" aria-label="放大">＋</button>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <button id="zoom-fit" class="toolbar-button toolbar-button-wide" type="button">全圖</button>
      </div>

      <footer class="statusbar">
        <span id="interaction-status">拖曳移動視野</span>
        <span class="status-shortcuts"><kbd>+</kbd><kbd>−</kbd> 縮放 <kbd>0</kbd> 重設 <kbd>Esc</kbd> 關閉提示</span>
      </footer>

      <article id="tooltip" class="node-tooltip" role="dialog" aria-live="polite" aria-label="節點資料" hidden>
        <div class="tooltip-accent" aria-hidden="true"></div>
        <div class="tooltip-header">
          <div>
            <p id="tooltip-kicker" class="tooltip-kicker"></p>
            <h2 id="tooltip-title"></h2>
          </div>
          <button id="tooltip-close" class="icon-button tooltip-close" type="button" aria-label="關閉節點資料">×</button>
        </div>
        <div id="tooltip-body" class="tooltip-body"></div>
      </article>

      <div id="error-state" class="error-card" role="alert" hidden>
        <strong>骰子樹載入失敗</strong>
        <span>請用本地伺服器開啟此頁面，避免瀏覽器封鎖資料檔。</span>
      </div>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
