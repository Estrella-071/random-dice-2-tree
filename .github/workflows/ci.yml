name: Validate project

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static data/docs validation
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      browser: ${{ steps.scope.outputs.browser }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Detect change scope
        id: scope
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CI_FORCE_FULL: ${{ github.event_name != 'pull_request' }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          elif [[ -n "${BEFORE_SHA:-}" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
            git diff --check "$BEFORE_SHA" "$HEAD_SHA"
          else
            git diff-tree --no-commit-id --name-only -r "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
            git diff-tree --check --root --no-commit-id "$HEAD_SHA"
          fi
          node scripts/ci_scope.mjs < "$RUNNER_TEMP/changed-files"
      - name: Install locked dependencies
        if: steps.scope.outputs.full == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit dependency graph
        if: steps.scope.outputs.full == 'true'
        run: npm run audit:deps
      - name: Validate data, generated files and documentation
        if: steps.scope.outputs.full == 'true'
        run: npm run validate
      - name: Build Pages allowlist staging
        if: steps.scope.outputs.full == 'true'
        run: npm run build:pages
      - name: Upload verified Pages staging
        if: steps.scope.outputs.full == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-pages-${{ github.run_id }}
          path: .pages
          include-hidden-files: true
          if-no-files-found: error
      - name: Validate documentation-only change
        if: steps.scope.outputs.docs_only == 'true'
        run: node scripts/check_docs.mjs

  browser:
    name: Chromium smoke suite
    runs-on: ubuntu-latest
    needs: static
    if: always()
    steps:
      - name: Fail when static gate failed
        if: needs.static.result != 'success'
        run: exit 1
      - name: Skip browser suite for non-runtime changes
        if: needs.static.outputs.browser != 'true'
        run: echo "No browser-relevant files changed; static validation remains the required gate."
      - name: Checkout
        if: needs.static.outputs.browser == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        if: needs.static.outputs.browser == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        if: needs.static.outputs.browser == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        if: needs.static.outputs.browser == 'true'
        run: npx playwright install --with-deps chromium
      - name: Download verified Pages staging
        if: needs.static.outputs.browser == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-pages-${{ github.run_id }}
          path: .pages
      - name: Run browser smoke suite
        if: needs.static.outputs.browser == 'true'
        env:
          VERIFY_SITE_DIR: .pages
        run: npm run test:browser
      - name: Upload browser evidence
        if: always() && needs.static.outputs.browser == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-suite-screenshots
          path: artifacts/verify-suite/
          if-no-files-found: ignore

  deploy:
    name: Deploy verified Pages artifact
    if: needs.static.result == 'success' && needs.browser.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [static, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Download verified Pages staging
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-pages-${{ github.run_id }}
          path: .pages
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./.pages
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03c # v4.0.5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
